; Earning station: reading timer + chores, reports to the print quota device

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = ota_split.csv
board_build.filesystem = littlefs
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    ; Configure TFT_eSPI here instead of editing the library's User_Setup.h
    -I../common
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    ; Household time zone: the reading week runs Sunday 00:00 to Saturday 23:59 here.
    ; POSIX rule for the clock + IANA name for Amazon. Examples:
    ;   US Central  "CST6CDT,M3.2.0,M11.1.0"        "America/Chicago"
    ;   US Pacific  "PST8PDT,M3.2.0,M11.1.0"        "America/Los_Angeles"
    ;   UK          "GMT0BST,M3.5.0/1,M10.5.0"      "Europe/London"
    ;   Central EU  "CET-1CEST,M3.5.0,M10.5.0/3"    "Europe/Berlin"
    '-DHOUSEHOLD_TZ_POSIX="EST5EDT,M3.2.0,M11.1.0"'
    '-DHOUSEHOLD_TZ_NAME="America/New_York"'

; Same firmware for the Wokwi emulator (Wokwi for VS Code / Cursor). Differences:
; - joins Wokwi's virtual Wi-Fi network instead of opening the setup portal
; - reads Wokwi's touchscreen (FT6206 over I2C) instead of the CYD's XPT2046
; - reaches the print quota device by address, since mDNS doesn't cross the emulator
;   gateway. Set BANK_HOST to the quota device's IP (or host.wokwi.internal:PORT).
[env:wokwi]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DWOKWI=1
    -DBANK_HOST=\"192.168.1.50\"  ; <- your print quota device's IP
extra_scripts = post:wokwi_merge.py
